[[permission]]
identifier = "storage"
description = "允许主窗口读写本地数据库与图片文件"
commands.allow = [
  "tasks_get_all",
  "task_put",
  "task_delete",
  "tasks_clear",
  "tasks_commit_deletion",
  "conversations_get_all",
  "conversation_put",
  "conversations_clear",
  "conversations_replace",
  "image_get",
  "image_put",
  "image_delete",
  "images_clear",
  "image_ids",
  "thumbnail_get",
  "thumbnail_put",
]
