[package]
name = "gpt-image-playground"
version = "0.7.17"
description = "GPT Image Playground"
edition = "2021"

[lib]
name = "gpt_image_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "unsafe-headers"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
sha2 = "0.10"
tempfile = "3"
# 版本与 tauri 内部使用的 tokio 一致，只用于 block_in_place
tokio = { version = "1", features = ["rt-multi-thread"] }
