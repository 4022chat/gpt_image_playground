name: Build and Publish Docker Image

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Build Desktop Client']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # 配置了签名私钥时，推送 tag 先构建客户端，构建成功后由 workflow_run 构建镜像；未配置时推送 tag 直接构建
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            build=true
          elif [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ -n "$SIGNING_KEY" ]] && build=true || build=false
          else
            [[ -z "$SIGNING_KEY" ]] && build=true || build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  docker:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_run 下 github.ref 是默认分支，semver 需从触发运行的 tag 名（head_branch）取；推送 tag 时从 github.ref 取
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gpt_image_playground
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}},enable=${{ github.event_name != 'workflow_run' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name != 'workflow_run' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
